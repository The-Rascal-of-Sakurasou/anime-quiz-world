name: Multiplayer SQL and Edge Function checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/migrations/20261112160000_retain_completed_aqw_match_history_after_exit.sql"
      - "scripts/test-match-history-migration.sql"
      - ".github/workflows/multiplayer-sql-tests.yml"
  push:
    paths:
      - "supabase/migrations/20261112160000_retain_completed_aqw_match_history_after_exit.sql"
      - "scripts/test-match-history-migration.sql"
      - "docs/ONLINE_MULTIPLAYER_SCHEMA_DRAFT.sql"
      - "supabase/functions/match/**"
      - "supabase/functions/aqw-match-prepare/**"
      - "scripts/test-multiplayer-sql.sql"
      - "scripts/build-question-bank-seed.mjs"
      - "scripts/test-question-bank-import.mjs"
      - "scripts/fixtures/question-bank-sample.json"
      - ".github/workflows/multiplayer-sql-tests.yml"

permissions:
  contents: read

jobs:
  postgres-integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply draft to disposable PostgreSQL and run integration flow
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/test-multiplayer-sql.sql
      - name: Verify generated question seed applies and is idempotent
        env:
          PGPASSWORD: postgres
        run: |
          node scripts/build-question-bank-seed.mjs scripts/fixtures/question-bank-sample.json /tmp/aqw-question-bank-seed.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/aqw-question-bank-seed.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/aqw-question-bank-seed.sql
          COUNT=$(psql -h 127.0.0.1 -U postgres -d postgres -Atc "SELECT count(*) FROM private.aqw_question_bank WHERE source_key LIKE 'ci:sample:%'")
          test "$COUNT" = "2"
      - name: Verify completed match history survives room exit
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE aqw_match_history_test"
          psql -h 127.0.0.1 -U postgres -d aqw_match_history_test -v ON_ERROR_STOP=1 -f scripts/test-match-history-migration.sql

  edge-function-typecheck:
    name: Edge Function type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check active question-preparation Edge Function types
        run: deno check supabase/functions/aqw-match-prepare/index.ts
      - name: Check draft multiplayer gateway types
        run: deno check supabase/functions/match/index.ts
      - name: Test question bank import generator
        run: |
          node --check scripts/build-question-bank-seed.mjs
          node scripts/test-question-bank-import.mjs
