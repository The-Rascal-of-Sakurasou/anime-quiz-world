name: Japanese synopsis coverage audit

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'aqw-text-utils.js'
      - 'scripts/audit-japanese-synopses.mjs'
      - 'scripts/test-japanese-synopsis-overrides.mjs'
      - '.github/workflows/japanese-synopsis-audit.yml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: aqw-japanese-synopsis-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate registered Japanese synopsis overrides
        run: |
          node --check scripts/test-japanese-synopsis-overrides.mjs
          node --check aqw-text-utils.js
          node scripts/test-aqw-text-utils.mjs
          node scripts/test-japanese-synopsis-overrides.mjs
      - name: Find popular anime missing Japanese synopsis entries
        run: node scripts/audit-japanese-synopses.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
