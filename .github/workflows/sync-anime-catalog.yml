name: Sync shared anime catalogue

on:
  push:
    branches: [main]
    paths:
      - "scripts/sync-anime-catalog.mjs"
      - "scripts/validate-anime-catalog.mjs"
      - "scripts/detect-title-image-text.py"
      - ".github/workflows/sync-anime-catalog.yml"
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    concurrency:
      group: aqw-shared-anime-catalogue-sync-v2
      cancel-in-progress: false
    runs-on: ubuntu-latest
    outputs:
      catalog_changed: ${{ steps.change.outputs.changed }}
      images_changed: ${{ steps.images.outputs.changed }}
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture image references before sync
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const catalog = JSON.parse(await readFile('data/anime-catalog.json', 'utf8'));
          const images = catalog.items.map(item => [
            Number(item.id),
            item.coverImage?.large || '',
            item.coverImage?.medium || '',
            item.coverImage?.extraLarge || ''
          ]).sort((a, b) => a[0] - b[0]);
          await writeFile(process.env.RUNNER_TEMP + '/aqw-image-references.json', JSON.stringify(images));
          NODE
      - name: Check catalogue sync script syntax
        run: node --check scripts/sync-anime-catalog.mjs
      - name: Build shared Japanese-origin anime catalogue
        run: node scripts/sync-anime-catalog.mjs
      - name: Validate generated catalogue
        run: node scripts/validate-anime-catalog.mjs
      - name: Detect catalogue changes
        id: change
        run: |
          if git diff --quiet -- data/anime-catalog.json data/anime-catalog.json.gz; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Detect image reference changes
        id: images
        run: |
          node --input-type=module <<'NODE'
          import { readFile, appendFile } from 'node:fs/promises';
          const catalog = JSON.parse(await readFile('data/anime-catalog.json', 'utf8'));
          const images = catalog.items.map(item => [
            Number(item.id),
            item.coverImage?.large || '',
            item.coverImage?.medium || '',
            item.coverImage?.extraLarge || ''
          ]).sort((a, b) => a[0] - b[0]);
          const before = await readFile(process.env.RUNNER_TEMP + '/aqw-image-references.json', 'utf8');
          const changed = before !== JSON.stringify(images);
          await appendFile(process.env.GITHUB_OUTPUT, 'changed=' + changed + '\\n');
          console.log('Image references changed: ' + changed);
          NODE
      - name: Commit catalogue when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/anime-catalog.json data/anime-catalog.json.gz
          if git diff --cached --quiet; then
            echo "Catalogue has no changes."
            exit 0
          fi
          git commit -m "Update shared anime catalogue"
          git pull --rebase origin main
          git push

  image-url-audit:
    needs: sync
    if: needs.sync.outputs.images_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate image audit script
        run: |
          node --check scripts/audit-anime-image-urls.mjs
          node scripts/audit-anime-image-urls.mjs --self-test
      - name: Audit catalogue image URLs
        run: node scripts/audit-anime-image-urls.mjs
      - name: Upload detailed image URL report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqw-image-url-audit
          path: artifacts/image-url-audit/report.json
          if-no-files-found: warn
          retention-days: 30
