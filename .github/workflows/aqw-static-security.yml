name: AQW static security checks

on:
  push:
    branches: [main]
    paths:
      - "multiplayer.html"
      - "index.html"
      - "data/anime-catalog.json"
      - "admin.html"
      - "recommend.html"
      - "guide.html"
      - "privacy.html"
      - "terms.html"
      - "sitemap.xml"
      - "robots.txt"
      - "scripts/test-static-security.mjs"
      - "scripts/test-anime-search-deduplication.mjs"
      - "scripts/test-official-site-links.mjs"
      - "scripts/test-anime-search-deduplication.mjs"
      - "scripts/sync-anime-catalog.mjs"
      - "scripts/audit-anime-image-urls.mjs"
      - "scripts/detect-title-image-text.py"
      - "scripts/audit-japanese-synopses.mjs"
      - ".github/workflows/japanese-synopsis-audit.yml"
      - ".github/workflows/detect-title-image-text.yml"
      - ".github/workflows/image-url-audit.yml"
      - ".github/workflows/sync-anime-catalog.yml"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "supabase/functions/aqw-match-prepare/**"
      - "supabase/functions/aqw-admin-control/**"
      - ".github/workflows/aqw-static-security.yml"
  pull_request:
    paths:
      - "multiplayer.html"
      - "index.html"
      - "data/anime-catalog.json"
      - "admin.html"
      - "recommend.html"
      - "guide.html"
      - "privacy.html"
      - "terms.html"
      - "scripts/test-static-security.mjs"
      - "scripts/sync-anime-catalog.mjs"
      - "scripts/audit-japanese-synopses.mjs"
      - ".github/workflows/japanese-synopsis-audit.yml"
      - ".github/workflows/sync-anime-catalog.yml"
      - "supabase/migrations/**"
      - "supabase/functions/aqw-admin-control/**"
      - ".github/workflows/aqw-static-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-security:
    name: Frontend security and JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check admin Edge Function
        run: deno check supabase/functions/aqw-admin-control/index.ts
      - name: Run security checks
        run: |
          node scripts/test-static-security.mjs
          node scripts/test-official-site-links.mjs
          node scripts/test-anime-search-deduplication.mjs
          node --check scripts/audit-anime-image-urls.mjs
          node scripts/audit-anime-image-urls.mjs --self-test
          node --check scripts/audit-japanese-synopses.mjs
          python3 -m py_compile scripts/detect-title-image-text.py
          python3 scripts/detect-title-image-text.py --self-test
