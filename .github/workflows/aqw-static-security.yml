name: AQW static security checks

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "admin.html"
      - "recommend.html"
      - "guide.html"
      - "privacy.html"
      - "terms.html"
      - "scripts/test-static-security.mjs"
      - "scripts/sync-anime-catalog.mjs"
      - ".github/workflows/sync-anime-catalog.yml"
      - ".github/workflows/aqw-static-security.yml"
  pull_request:
    paths:
      - "index.html"
      - "admin.html"
      - "recommend.html"
      - "guide.html"
      - "privacy.html"
      - "terms.html"
      - "scripts/test-static-security.mjs"
      - ".github/workflows/aqw-static-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-security:
    name: Frontend security and JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run security checks
        run: node scripts/test-static-security.mjs
