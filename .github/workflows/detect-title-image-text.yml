name: Detect anime title text in cover images

on:
  # Run OCR when its implementation or workflow changes.
  # Catalogue changes are audited by the sync workflow's title-image-audit job.
  push:
    branches: [main]
    paths:
      - "scripts/detect-title-image-text.py"
      - ".github/workflows/detect-title-image-text.yml"
  pull_request:
    paths:
      - "index.html"
      - "scripts/detect-title-image-text.py"
      - ".github/workflows/detect-title-image-text.yml"
  workflow_dispatch:
  schedule:
    # Weekly re-audit; catalogue changes also trigger an immediate audit.
    - cron: '20 18 * * 0'

permissions:
  contents: write

concurrency:
  group: aqw-title-image-ocr-v2
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
      - name: Validate OCR script without network access
        run: |
          python3 -m py_compile scripts/detect-title-image-text.py
          python3 scripts/detect-title-image-text.py --self-test

  audit:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Install Japanese and English OCR engine
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail

          # Reuse runner-provided Tesseract when it already has both languages.
          if command -v tesseract >/dev/null 2>&1 \
            && tesseract --list-langs 2>/dev/null | grep -qx 'jpn' \
            && tesseract --list-langs 2>/dev/null | grep -qx 'eng'; then
            echo "Tesseract with Japanese and English language data is already available."
            exit 0
          fi

          # GitHub-hosted runner package mirrors can temporarily fail DNS resolution.
          # Retry both index refresh and installation rather than failing immediately.
          for attempt in 1 2 3 4 5; do
            echo "Tesseract installation attempt ${attempt}/5"
            if sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update \
              && sudo apt-get -o Acquire::Retries=5 install -y tesseract-ocr tesseract-ocr-jpn tesseract-ocr-eng; then
              break
            fi
            if [ "${attempt}" -eq 5 ]; then
              echo "Could not install Tesseract after five attempts." >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done

          tesseract --list-langs
      - name: Verify OCR script
        run: |
          tesseract --list-langs
          python3 -m py_compile scripts/detect-title-image-text.py
          python3 scripts/detect-title-image-text.py --self-test
      - name: Detect titles in cover images
        run: python3 scripts/detect-title-image-text.py
      - name: Upload OCR audit report
        if: always() && hashFiles('artifacts/title-image-audit/report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: title-image-audit-report
          path: artifacts/title-image-audit/report.json
          retention-days: 14
      - name: Commit exclusion list when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/title-image-exclusions.json
          if git diff --cached --quiet; then
            echo "Title-image exclusion list has no changes."
            exit 0
          fi
          git commit -m "Update title-image OCR exclusions"
          git pull --rebase origin main
          git push
