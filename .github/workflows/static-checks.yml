name: AQW static checks

on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "scripts/**"
      - "supabase/**"
      - ".github/workflows/static-checks.yml"
  pull_request:
    paths:
      - "**.html"
      - "scripts/**"
      - "supabase/**"
      - ".github/workflows/static-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript tool syntax
        run: |
          node --check scripts/sync-anime-catalog.mjs
          node --check scripts/validate-anime-catalog.mjs
          node --check scripts/audit-anime-image-urls.mjs
          node --check scripts/test-static-security.mjs
      - name: Run static security and regression checks
        run: node scripts/test-static-security.mjs
