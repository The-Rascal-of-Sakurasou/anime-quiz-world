name: AQW browser smoke tests

on:
  pull_request:
    paths:
      - .github/workflows/browser-smoke.yml
      - index.html
      - recommend.html
      - multiplayer.html
      - admin.html
      - guide.html
      - privacy.html
      - terms.html
      - responsive.css
      - scripts/browser-smoke.py
      - scripts/test-official-site-links.mjs
      - scripts/audit-anime-image-urls.mjs
      - scripts/validate-anime-catalog.mjs
      - scripts/test-anime-search-deduplication.mjs
      - data/anime-catalog.json
      - data/anime-catalog.json.gz
  push:
    branches:
      - main
    paths:
      - .github/workflows/browser-smoke.yml
      - index.html
      - recommend.html
      - multiplayer.html
      - admin.html
      - guide.html
      - privacy.html
      - terms.html
      - responsive.css
      - scripts/browser-smoke.py
      - scripts/test-official-site-links.mjs
      - scripts/audit-anime-image-urls.mjs
      - scripts/validate-anime-catalog.mjs
      - scripts/test-anime-search-deduplication.mjs
      - data/anime-catalog.json
      - data/anime-catalog.json.gz
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aqw-browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out the test revision
        uses: actions/checkout@v4

      - name: Start a local preview for deterministic browser tests
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory . >/tmp/aqw-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/index.html -o /tmp/aqw-index.html; then
              echo "Local preview of the checked-out revision is reachable."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/aqw-http.log
          exit 1

      - name: Check deployed GitHub Pages site reachability
        if: github.event_name != 'pull_request'
        env:
          AQW_BASE_URL: https://the-rascal-of-sakurasou.github.io/anime-quiz-world
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if curl --fail --silent --show-error "$AQW_BASE_URL/index.html" -o /tmp/aqw-published-index.html \
              && grep -q 'aqwAuthForm' /tmp/aqw-published-index.html; then
              echo "Published Anime Quiz World page is reachable."
              exit 0
            fi
            echo "Published page not reachable (attempt ${attempt}/10)."
            sleep 6
          done
          echo "Published Anime Quiz World page is unavailable." >&2
          exit 1

      - name: Set up Node.js for official-site link checks
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test official-site link resolution and mobile navigation
        run: node scripts/test-official-site-links.mjs

      - name: Validate shared catalogue and search deduplication
        run: |
          node --check scripts/validate-anime-catalog.mjs
          node scripts/validate-anime-catalog.mjs
          node scripts/test-anime-search-deduplication.mjs

      - name: Test top 100 popular anime cover URLs
        run: |
          node --check scripts/audit-anime-image-urls.mjs
          node scripts/audit-anime-image-urls.mjs --self-test
          node scripts/audit-anime-image-urls.mjs --limit 100

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Validate browser test script
        run: python -m py_compile scripts/browser-smoke.py

      - name: Test quiz and recommendation diagnosis in Chromium
        env:
          AQW_BASE_URL: http://127.0.0.1:8765
        run: python scripts/browser-smoke.py

      - name: Wait for deployed revision and validate public catalogue
        if: github.event_name != 'pull_request'
        env:
          AQW_BASE_URL: https://the-rascal-of-sakurasou.github.io/anime-quiz-world
        run: |
          set -euo pipefail
          EXPECTED_MARKER=$(python - <<'PY'
          import re
          with open("index.html", encoding="utf-8") as handle:
              html = handle.read()
          match = re.search(r'<meta name="aqw-build-marker" content="([^"]+)"', html)
          if not match:
              raise SystemExit("Expected AQW build marker is missing.")
          print(match.group(1))
          PY
          )
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$AQW_BASE_URL/index.html" -o /tmp/aqw-live-index.html \
              && grep -Fq "$EXPECTED_MARKER" /tmp/aqw-live-index.html \
              && curl --fail --silent --show-error "$AQW_BASE_URL/data/anime-catalog.json.gz" -o /tmp/aqw-live-catalogue.gz; then
              python - <<'PY'
          import gzip, json
          with gzip.open("/tmp/aqw-live-catalogue.gz", "rt", encoding="utf-8") as handle:
              catalogue = json.load(handle)
          items = catalogue.get("items", [])
          assert len(items) >= 9000, f"Unexpected public catalogue size: {len(items)}"
          assert not any("characters" in item for item in items), "Unused character records found."
          print(f"Live catalogue verified: {len(items)} records.")
          PY
              exit 0
            fi
            echo "Waiting for deployed build $EXPECTED_MARKER (attempt ${attempt}/30)."
            sleep 6
          done
          echo "The expected public build was not deployed." >&2
          exit 1

      - name: Test deployed public site with real catalogue data
        if: github.event_name != 'pull_request'
        env:
          AQW_BASE_URL: https://the-rascal-of-sakurasou.github.io/anime-quiz-world
        run: python scripts/browser-smoke.py --public-smoke
