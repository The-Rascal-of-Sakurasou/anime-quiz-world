name: AQW browser smoke tests

on:
  pull_request:
    paths:
      - .github/workflows/browser-smoke.yml
      - index.html
      - recommend.html
      - scripts/browser-smoke.py
      - data/anime-catalog.json
  push:
    branches:
      - main
    paths:
      - .github/workflows/browser-smoke.yml
      - index.html
      - recommend.html
      - scripts/browser-smoke.py
      - data/anime-catalog.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aqw-browser-smoke
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out the test revision
        uses: actions/checkout@v4

      - name: Start a local preview for pull-request browser tests
        if: github.event_name == 'pull_request'
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory . >/tmp/aqw-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/index.html -o /tmp/aqw-index.html; then
              echo "Local pull-request preview is reachable."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/aqw-http.log
          exit 1

      - name: Check deployed GitHub Pages site
        if: github.event_name != 'pull_request'
        env:
          AQW_BASE_URL: https://the-rascal-of-sakurasou.github.io/anime-quiz-world
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if curl --fail --silent --show-error "$AQW_BASE_URL/index.html" -o /tmp/aqw-index.html \
              && grep -q 'aqwAuthForm' /tmp/aqw-index.html; then
              echo "Published Anime Quiz World page is reachable."
              exit 0
            fi
            echo "Published page not ready (attempt ${attempt}/10)."
            sleep 6
          done
          echo "Published Anime Quiz World page did not become ready." >&2
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Validate browser test script
        run: python -m py_compile scripts/browser-smoke.py

      - name: Test quiz and recommendation diagnosis in Chromium
        env:
          AQW_BASE_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:8765' || 'https://the-rascal-of-sakurasou.github.io/anime-quiz-world' }}
        run: python scripts/browser-smoke.py
