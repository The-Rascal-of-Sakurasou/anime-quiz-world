name: AQW browser smoke tests

on:
  workflow_run:
    workflows:
      - pages build and deployment
    types:
      - completed

permissions:
  contents: read

jobs:
  browser-smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Validate browser test script
        run: python -m py_compile scripts/browser-smoke.py

      - name: Test deployed quiz and recommendation diagnosis
        env:
          AQW_BASE_URL: https://the-rascal-of-sakurasou.github.io/anime-quiz-world
        run: python scripts/browser-smoke.py
