name: AQW browser smoke tests

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/browser-smoke.yml
      - scripts/browser-smoke.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out the test revision
        uses: actions/checkout@v4

      - name: Wait for GitHub Pages deployment
        run: sleep 120

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Validate browser test script
        run: python -m py_compile scripts/browser-smoke.py

      - name: Test deployed quiz and recommendation diagnosis
        env:
          AQW_BASE_URL: https://the-rascal-of-sakurasou.github.io/anime-quiz-world
        run: python scripts/browser-smoke.py
