name: AQW catalogue validation

on:
  push:
    branches: [main]
    paths:
      - "data/anime-catalog.json"
      - "data/anime-catalog.json.gz"
      - "scripts/validate-anime-catalog.mjs"
      - "scripts/test-anime-origin-policy.mjs"
      - "anime-origin-policy.js"
      - "scripts/test_anime_catalog_origin_policy.py"
      - "scripts/audit-anime-catalog.py"
      - "scripts/audit-question-mode-coverage.mjs"
      - "scripts/sync-anime-catalog.mjs"
      - "scripts/test-anime-catalog-validator.mjs"
      - "scripts/fixtures/anime-catalog-sample.json"
      - ".github/workflows/catalog-validation.yml"
  pull_request:
    paths:
      - "data/anime-catalog.json"
      - "data/anime-catalog.json.gz"
      - "scripts/validate-anime-catalog.mjs"
      - "scripts/test-anime-origin-policy.mjs"
      - "anime-origin-policy.js"
      - "scripts/test_anime_catalog_origin_policy.py"
      - "scripts/audit-anime-catalog.py"
      - "scripts/audit-question-mode-coverage.mjs"
      - "scripts/sync-anime-catalog.mjs"
      - "scripts/test-anime-catalog-validator.mjs"
      - "scripts/fixtures/anime-catalog-sample.json"
      - ".github/workflows/catalog-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-catalogue:
    name: Validate catalogue schema and origin rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check validator syntax
        run: node --check scripts/validate-anime-catalog.mjs
      - name: Run catalogue validator regression tests
        run: node scripts/test-anime-catalog-validator.mjs
      - name: Validate known-good Japanese-origin fixture
        run: node scripts/validate-anime-catalog.mjs scripts/fixtures/anime-catalog-sample.json
      - name: Validate production catalogue and compressed copy
        run: node scripts/validate-anime-catalog.mjs
